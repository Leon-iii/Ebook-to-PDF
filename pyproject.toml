[project]
name = "ebook-to-pdf"
version = "0.1.0"
description = "Capture a visible e-book viewer region and assemble the pages into a personal-use PDF."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "img2pdf>=0.6.1",
    "mss>=10.1.0",
    "pillow>=11.3.0",
    "platformdirs>=4.4.0",
    "pynput>=1.8.1",
]

[project.gui-scripts]
ebook-to-pdf = "ebook_to_pdf.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebook_to_pdf"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

